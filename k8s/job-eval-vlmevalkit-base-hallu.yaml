apiVersion: batch/v1
kind: Job
metadata:
  name: eval-vlmevalkit-base-hallu
  labels:
    app: ms-swift
    task: benchmark-evaluation
    framework: vlmevalkit
    model: qwen-7b-rl
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ms-swift
        task: benchmark-evaluation
        framework: vlmevalkit
    spec:
      restartPolicy: Never

      containers:
      - name: evaluator
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always

        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "========================================="
          echo "VLMEvalKit Benchmark Evaluation"
          echo "========================================="
          echo ""
          echo "Model Path:       ${MODEL_PATH}"
          echo "Base Model Path:  ${BASE_MODEL_PATH:-none (full model)}"
          echo "Model Name:       ${MODEL_NAME}"
          echo "Output Dir:  ${OUTPUT_DIR}"
          echo "Num GPUs:    ${NUM_GPUS}"
          echo "Benchmarks:  ${BENCHMARKS}"
          echo "Batch Size:  ${BATCH_SIZE}"
          echo ""

          # Verify GPU availability
          echo "GPU Status:"
          nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv
          echo ""

          # Verify model path (local dir or HuggingFace model ID)
          if [ -d "${MODEL_PATH}" ]; then
            echo "Local model checkpoint found:"
            ls -lh "${MODEL_PATH}/" | head -5
          else
            echo "MODEL_PATH is not a local directory: ${MODEL_PATH}"
            echo "Treating as HuggingFace model ID (will download at runtime)..."
          fi
          echo ""

          # Create output directory
          mkdir -p "${OUTPUT_DIR}"

          # Setup VLMEvalKit
          VLMEVALKIT_DIR="/tmp/VLMEvalKit"
          if [ ! -d "${VLMEVALKIT_DIR}" ]; then
            git clone https://github.com/open-compass/VLMEvalKit.git "${VLMEVALKIT_DIR}"
          fi
          pip install --index-url https://pypi.org/simple num2words openai-clip || true
          pip install -e "${VLMEVALKIT_DIR}" || exit 1

          # Register model
          python /workspace/scripts/evaluation/register_vlmevalkit_model.py \
            --model-path ${MODEL_PATH} \
            --model-name ${MODEL_NAME} \
            --vlmevalkit-dir ${VLMEVALKIT_DIR}

          # Patch use_custom_prompt=True in config
          sed -i 's/use_custom_prompt=False/use_custom_prompt=True/g' ${VLMEVALKIT_DIR}/vlmeval/config.py
          echo "Patched use_custom_prompt=True"

          # Create .env for API access
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}" > "${VLMEVALKIT_DIR}/.env"
            echo "OPENAI_API_BASE=${OPENAI_API_BASE}" >> "${VLMEVALKIT_DIR}/.env"
          fi

          # Run VLMEvalKit directly with raw dataset names
          echo "Starting VLMEvalKit evaluation..."
          # Fix: latest VLMEvalKit uses vlm.Qwen2VLChat (module-qualified)
          python3 -c "
          import re
          p = '${VLMEVALKIT_DIR}/vlmeval/config.py'
          with open(p) as f: c = f.read()
          c = re.sub(r'(?<!vlm\.)Qwen2VLChat', 'vlm.Qwen2VLChat', c)
          with open(p, 'w') as f: f.write(c)
          print('Patched bare Qwen2VLChat -> vlm.Qwen2VLChat')
          "

          torchrun --nproc-per-node=${NUM_GPUS} ${VLMEVALKIT_DIR}/run.py \
            --data POPE AMBER \
            --model ${MODEL_NAME} \
            --work-dir ${OUTPUT_DIR} \
            --verbose \
            --reuse \
            --judge gpt-4o-mini

          echo ""
          echo "========================================="
          echo "VLMEvalKit Evaluation Complete"
          echo "========================================="
          echo "Results saved to: ${OUTPUT_DIR}"
          ls -lhR "${OUTPUT_DIR}/"

        env:
        # HuggingFace token
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # OpenAI-compatible API (for GPT-based answer extraction in VLMEvalKit)
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key
              key: key
              optional: true
        - name: OPENAI_API_BASE
          value: "https://openrouter.ai/api/v1/chat/completions"

        # Cache directories
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: HF_DATASETS_CACHE
          value: "/cache/hf/datasets"
        - name: TORCH_HOME
          value: "/cache/torch"

        # Evaluation configuration
        - name: MODEL_PATH
          #value: "llava-hf/llava-1.5-7b-hf"
          #value: "/outputs/llava-7b-fire-full-sft-multi-and-single-turn/v1-20260208-031459/checkpoint-1856"
          #value: "/outputs/grpo_self_reflection_v1/final"
          value: "Qwen/Qwen2.5-VL-7B-Instruct"
        - name: BASE_MODEL_PATH
          value: ""
        # - name: MODEL_PATH
        #   #value: "/outputs/llava-7b-fire-full-sft-multi-and-single-turn/v1-20260208-031459/checkpoint-1856"
        #   #value: "/outputs/grpo_self_reflection_v1/final"
        #   value: ""
        # - name: BASE_MODEL_PATH
         # value: "/outputs/llava-7b-fire-full-sft-multi-and-single-turn/v1-20260208-031459/checkpoint-1856"  # Set to base model HF ID/path for LoRA adapter checkpoints
        - name: MODEL_NAME
          #value: "FireSFT-LLaVA-7B"
          value: "Qwen2.5-VL-7B-Base-v2"
        - name: OUTPUT_DIR
          value: "/outputs/benchmark_results/vlmevalkit_base_hallu"
        - name: NUM_GPUS
          value: "1"
        - name: BENCHMARKS
          value: "llava_bench,mmhal"
        - name: BATCH_SIZE
          value: "1"

        # Python and CUDA settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

        resources:
          requests:
            nvidia.com/rtxa6000: "1"
            memory: "14Gi"
            cpu: "2"
          limits:
            nvidia.com/rtxa6000: "1"
            memory: "14Gi"
            cpu: "2"

        volumeMounts:
        - name: outputs-volume
          mountPath: /outputs
        - name: cache-volume
          mountPath: /cache
        - name: dev-shm
          mountPath: /dev/shm

      tolerations:
        - effect: NoSchedule
          key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule


      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 200Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
