apiVersion: batch/v1
kind: Job
metadata:
  name: qwen2-5vl-7b-fire-full-sft-feedback
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: ms-swift-2
        task: fire-full-sft-2
        model: qwen2-5-vl-7b
        gpu: a100
    spec:
      restartPolicy: Never

      containers:
      - name: ms-swift-trainer-2
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always
        command: ["/bin/bash"]
        args:
        - "-c"
        - |
          echo "========================================="
          echo "FIRE Full Fine-Tuning (4 GPUs)"
          echo "Full Parameter Update for Qwen2.5-VL-7B"
          echo "========================================="
          echo ""

          # Verify datasets exist (handles multiple space-separated paths with #sample syntax)
          echo "Checking datasets..."
          for dataset in ${DATASET_PATH}; do
            # Strip #sample_count suffix for file existence check
            dataset_file="${dataset%%#*}"
            if [ ! -f "${dataset_file}" ]; then
              echo "ERROR: Training dataset not found!"
              echo "Expected: ${dataset_file}"
              echo ""
              echo "Please ensure the dataset file exists."
              exit 1
            fi
            echo "Found: ${dataset}"
            ls -lh "${dataset_file}"
            wc -l "${dataset_file}"
            echo ""
          done

          # GPU verification
          echo "GPU Status:"
          nvidia-smi
          echo ""

          # Start training
          echo "Starting full fine-tuning..."
          echo ""
          /workspace/scripts/training/run_full_sft_qwen3vl_fire_8gpu.sh

        resources:
          requests:
            nvidia.com/a100: "4"
            memory: "96Gi"
            cpu: "6"
          limits:
            nvidia.com/a100: "4"
            memory: "110Gi"
            cpu: "6"

        volumeMounts:
        - name: cache-volume
          mountPath: /cache
        - name: outputs-volume
          mountPath: /outputs
        - name: dev-shm
          mountPath: /dev/shm

        env:
        # HuggingFace token (required for gated models)
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # Cache directories (using ephemeral emptyDir)
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: HF_DATASETS_CACHE
          value: "/cache/hf/datasets"
        - name: TORCH_HOME
          value: "/cache/torch"
        - name: PIP_CACHE_DIR
          value: "/cache/pip"
        - name: MODELSCOPE_CACHE
          value: "/cache/modelscope"
        - name: OUTPUT_DIR
          value: "/outputs"

        # Model configuration
        - name: MODEL_ID
          value: "Qwen/Qwen2.5-VL-7B-Instruct"
        # - name: DATASET_PATH
        #   value: "/outputs/fire_preprocessed_v2/fire_sharegpt_train.jsonl"
        - name: DATASET_PATH
          value: "/outputs/fire_preprocessed_v3/fire_feedback_train.jsonl /outputs/fire_preprocessed_v3/fire_messages_train.jsonl"

        - name: MAX_LEN
          value: "3248"
        - name: IMAGE_MAX_TOKEN_NUM
          value: "2048"


        # Training hyperparameters (configurable)
        - name: BATCH
          value: "4"           # Per-GPU batch size (safe with MAX_LEN=3584)
        - name: GRAD_ACC
          value: "8"           # Gradient accumulation steps
        - name: EPOCHS
          value: "2"           # Number of training epochs
        - name: LR
          value: "3e-6"        # Learning rate (lower for full fine-tuning)
        - name: WARMUP_RATIO
          value: "0.03"        # Warmup ratio
        - name: WEIGHT_DECAY
          value: "0.01"        # Weight decay
        - name: MAX_GRAD_NORM
          value: "1.0"         # Gradient clipping
        - name: LOSS_SCALE
          value: "default"

        # DDP configuration
        - name: NPROC
          value: "4"           # Number of GPUs

        - name: NCCL_DEBUG
          value: "WARN"
        - name: NCCL_TIMEOUT
          value: "1800"        # 30 min timeout instead of hang

        # Output configuration
        - name: RUN_NAME
          value: "qwen2_5vl-7b-fire-full-sft-4gpu-feedback-training-data2"

        # Logging configuration
        - name: LOGGING_STEPS
          value: "5"
        - name: EVAL_STEPS
          value: "200"
        - name: SAVE_STEPS
          value: "400"
        - name: SAVE_TOTAL_LIMIT
          value: "2"

        # Python and CUDA settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

      tolerations:
        - effect: NoSchedule
          key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule
        #Tolerate nautilus.io/issue taints (nodes with known issues but still usable)
        # - key: nautilus.io/issue
        #   operator: Exists
        #   effect: NoSchedule

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 200Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
