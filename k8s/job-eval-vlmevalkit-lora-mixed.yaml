apiVersion: batch/v1
kind: Job
metadata:
  name: eval-vlmevalkit-lora-mixed-v1
  labels:
    app: ms-swift
    task: benchmark-evaluation
    framework: vlmevalkit
    model: qwen-7b-rl
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ms-swift
        task: benchmark-evaluation
        framework: vlmevalkit
    spec:
      restartPolicy: Never

      containers:
      - name: evaluator
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always

        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "========================================="
          echo "VLMEvalKit Benchmark Evaluation"
          echo "========================================="
          echo ""
          echo "Model Path:       ${MODEL_PATH}"
          echo "Base Model Path:  ${BASE_MODEL_PATH:-none (full model)}"
          echo "Model Name:       ${MODEL_NAME}"
          echo "Output Dir:  ${OUTPUT_DIR}"
          echo "Num GPUs:    ${NUM_GPUS}"
          echo "Benchmarks:  ${BENCHMARKS}"
          echo "Batch Size:  ${BATCH_SIZE}"
          echo ""

          # Verify GPU availability
          echo "GPU Status:"
          nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv
          echo ""

          # Verify model path (local dir or HuggingFace model ID)
          if [ -d "${MODEL_PATH}" ]; then
            echo "Local model checkpoint found:"
            ls -lh "${MODEL_PATH}/" | head -5
          else
            echo "MODEL_PATH is not a local directory: ${MODEL_PATH}"
            echo "Treating as HuggingFace model ID (will download at runtime)..."
          fi
          echo ""

          # Create output directory
          mkdir -p "${OUTPUT_DIR}"

          # Setup VLMEvalKit
          VLMEVALKIT_DIR="/tmp/VLMEvalKit"
          if [ ! -d "${VLMEVALKIT_DIR}" ]; then
            git clone https://github.com/open-compass/VLMEvalKit.git "${VLMEVALKIT_DIR}"
          fi
          pip install --index-url https://pypi.org/simple num2words openai-clip || true
          pip install -e "${VLMEVALKIT_DIR}" || exit 1

          # Merge LoRA adapter if detected
          if [ -f "${MODEL_PATH}/adapter_config.json" ]; then
            echo "LoRA adapter detected. Merging into base model..."
            MERGED_PATH="/tmp/merged_model"
            python3 -c "
          from peft import PeftModel
          from transformers import Qwen2_5_VLForConditionalGeneration, AutoProcessor
          import torch
          base_path = '${BASE_MODEL_PATH}'
          adapter_path = '${MODEL_PATH}'
          merged_path = '${MERGED_PATH}'
          print(f'Loading base model: {base_path}')
          model = Qwen2_5_VLForConditionalGeneration.from_pretrained(base_path, torch_dtype=torch.bfloat16, device_map='cpu')
          print(f'Loading LoRA adapter: {adapter_path}')
          model = PeftModel.from_pretrained(model, adapter_path)
          print('Merging...')
          model = model.merge_and_unload()
          print(f'Saving merged model to: {merged_path}')
          model.save_pretrained(merged_path)
          processor = AutoProcessor.from_pretrained(base_path)
          processor.save_pretrained(merged_path)
          print('Merge complete')
          "
            MODEL_PATH="${MERGED_PATH}"
            echo "Using merged model at: ${MODEL_PATH}"
          fi

          # Fix missing model_type in config.json
          python3 -c "
          import json, os
          cfg_path = '${MODEL_PATH}/config.json'
          if os.path.exists(cfg_path):
              with open(cfg_path) as f:
                  cfg = json.load(f)
              if 'model_type' not in cfg:
                  cfg['model_type'] = 'qwen2_5_vl'
                  with open(cfg_path, 'w') as f:
                      json.dump(cfg, f, indent=2)
                  print(f'Added model_type=qwen2_5_vl to {cfg_path}')
          "

          # Register model with system_prompt directly into config.py
          # Find the closing '}' of qwen2vl_series dict and insert before it
          python3 << 'PYEOF'
          import os
          vlmevalkit_dir = os.environ.get('VLMEVALKIT_DIR', '/tmp/VLMEvalKit')
          config_path = f'{vlmevalkit_dir}/vlmeval/config.py'
          model_name = os.environ.get('MODEL_NAME', '')
          model_path = os.environ.get('MODEL_PATH', '')
          system_prompt = os.environ.get('SYSTEM_PROMPT', '')

          with open(config_path) as f:
              content = f.read()

          if model_name in content:
              print(f'Model {model_name} already registered')
          else:
              # Find qwen2vl_series dict and insert before its closing '}'
              series_start = content.find('qwen2vl_series = {')
              if series_start == -1:
                  print('ERROR: qwen2vl_series not found in config.py')
                  exit(1)
              # Find the closing '}' of this dict by tracking brace depth
              brace_depth = 0
              closing_brace = -1
              for i in range(series_start, len(content)):
                  if content[i] == '{':
                      brace_depth += 1
                  elif content[i] == '}':
                      brace_depth -= 1
                      if brace_depth == 0:
                          closing_brace = i
                          break
              if closing_brace == -1:
                  print('ERROR: could not find closing brace of qwen2vl_series')
                  exit(1)
              entry = (
                  f'    "{model_name}": partial(\n'
                  f'        vlm.Qwen2VLChat,\n'
                  f'        model_path="{model_path}",\n'
                  f'        min_pixels=1280 * 28 * 28,\n'
                  f'        max_pixels=16384 * 28 * 28,\n'
                  f'        use_custom_prompt=False,\n'
                  f'        system_prompt="{system_prompt}",\n'
                  f'    ),\n'
              )
              content = content[:closing_brace] + entry + content[closing_brace:]
              with open(config_path, 'w') as f:
                  f.write(content)
              print(f'Registered {model_name} in qwen2vl_series')
          PYEOF

          # Create .env for API access
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}" > "${VLMEVALKIT_DIR}/.env"
            echo "OPENAI_API_BASE=${OPENAI_API_BASE}" >> "${VLMEVALKIT_DIR}/.env"
          fi

          # Run VLMEvalKit directly with raw dataset names
          echo "Starting VLMEvalKit evaluation..."
          torchrun --nproc-per-node=${NUM_GPUS} ${VLMEVALKIT_DIR}/run.py \
            --data MMBench_DEV_EN MME SEEDBench_IMG MMMU_DEV_VAL MMVet AI2D_TEST OCRBench MathVista_MINI GQA_TestDev_Balanced ScienceQA_TEST ChartQA_TEST HallusionBench LLaVA_Bench MMHal \
            --model ${MODEL_NAME} \
            --work-dir ${OUTPUT_DIR} \
            --verbose \
            --reuse \
            --judge gpt-4o-mini

          echo ""
          echo "========================================="
          echo "VLMEvalKit Evaluation Complete"
          echo "========================================="
          echo "Results saved to: ${OUTPUT_DIR}"
          ls -lhR "${OUTPUT_DIR}/"

        env:
        # HuggingFace token
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # OpenAI-compatible API (for GPT-based answer extraction in VLMEvalKit)
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key
              key: key
              optional: true
        - name: OPENAI_API_BASE
          value: "https://openrouter.ai/api/v1/chat/completions"

        # Cache directories
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: HF_DATASETS_CACHE
          value: "/cache/hf/datasets"
        - name: TORCH_HOME
          value: "/cache/torch"

        # Evaluation configuration
        - name: MODEL_PATH
          #value: "llava-hf/llava-1.5-7b-hf"
          #value: "/outputs/llava-7b-fire-full-sft-multi-and-single-turn/v1-20260208-031459/checkpoint-1856"
          #value: "/outputs/grpo_self_reflection_v1/final"
          value: "/outputs/qwen-7b-lora-mixed-v1/v0-20260323-084417/checkpoint-1018"
        - name: BASE_MODEL_PATH
          value: "Qwen/Qwen2.5-VL-7B-Instruct"
        # - name: MODEL_PATH
        #   #value: "/outputs/llava-7b-fire-full-sft-multi-and-single-turn/v1-20260208-031459/checkpoint-1856"
        #   #value: "/outputs/grpo_self_reflection_v1/final"
        #   value: ""
        # - name: BASE_MODEL_PATH
         # value: "/outputs/llava-7b-fire-full-sft-multi-and-single-turn/v1-20260208-031459/checkpoint-1856"  # Set to base model HF ID/path for LoRA adapter checkpoints
        - name: MODEL_NAME
          #value: "FireSFT-LLaVA-7B"
          value: "QWEN-2-5Vl-lora-mixed-v1"
        - name: OUTPUT_DIR
          value: "/outputs/benchmark_results/vlmevalkit_v3"
        - name: NUM_GPUS
          value: "1"
        - name: BENCHMARKS
          value: "llava_bench,mmhal"
        - name: BATCH_SIZE
          value: "1"

        # System prompt for FT model
        - name: SYSTEM_PROMPT
          value: 'You are a helpful vision-language assistant. You should produce accurate, detailed, and grounded answers based on the image and the user''s instructions. When given feedback, critique, or scores, revise your response to improve correctness, specificity, and completeness.'

        # Python and CUDA settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

        resources:
          requests:
            nvidia.com/rtxa6000: "1"
            memory: "32Gi"
            cpu: "2"
          limits:
            nvidia.com/rtxa6000: "1"
            memory: "32Gi"
            cpu: "2"

        volumeMounts:
        - name: outputs-volume
          mountPath: /outputs
        - name: cache-volume
          mountPath: /cache
        - name: dev-shm
          mountPath: /dev/shm

      tolerations:
        - effect: NoSchedule
          key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule


      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 200Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
