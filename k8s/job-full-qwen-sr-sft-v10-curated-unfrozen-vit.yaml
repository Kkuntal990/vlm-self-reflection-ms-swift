apiVersion: batch/v1
kind: Job
metadata:
  name: qwen-7b-sr-sft-v10-curated-unfrozen-vit
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: ms-swift-2
        task: sr-sft-v10-curated-unfrozen-vit
        model: qwen2-5-vl-7b
        gpu: a100
    spec:
      restartPolicy: Never

      containers:
      - name: ms-swift-trainer-2
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always
        command: ["/bin/bash"]
        args:
        - "-c"
        - |
          echo "========================================="
          echo "Self-Reflection SFT (4 GPUs, ViT UNFROZEN)"
          echo "Pattern A A1->F1->A2 on v10-curated data"
          echo "========================================="
          echo ""

          # Verify datasets exist (handles multiple space-separated paths with #sample syntax)
          echo "Checking datasets..."
          for dataset in ${DATASET_PATH}; do
            # Strip #sample_count suffix for file existence check
            dataset_file="${dataset%%#*}"
            if [ ! -f "${dataset_file}" ]; then
              echo "ERROR: Training dataset not found!"
              echo "Expected: ${dataset_file}"
              echo ""
              echo "Please ensure the dataset file exists."
              exit 1
            fi
            echo "Found: ${dataset}"
            ls -lh "${dataset_file}"
            wc -l "${dataset_file}"
            echo ""
          done

          # GPU verification
          echo "GPU Status:"
          nvidia-smi
          echo ""

          # Start training
          echo "Starting full fine-tuning (ViT + aligner UNFROZEN)..."
          echo ""
          /workspace/scripts/training/run_full_sft_qwen3vl_fire_8gpu.sh

        resources:
          requests:
            nvidia.com/a100: "4"
            memory: "128Gi"
            cpu: "8"
          limits:
            nvidia.com/a100: "4"
            memory: "128Gi"
            cpu: "8"

        volumeMounts:
        - name: cache-volume
          mountPath: /cache
        - name: outputs-volume
          mountPath: /outputs
        - name: dev-shm
          mountPath: /dev/shm

        env:
        # HuggingFace token (required for gated models)
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # Cache directories (using ephemeral emptyDir)
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: HF_DATASETS_CACHE
          value: "/cache/hf/datasets"
        - name: TORCH_HOME
          value: "/cache/torch"
        - name: PIP_CACHE_DIR
          value: "/cache/pip"
        - name: MODELSCOPE_CACHE
          value: "/cache/modelscope"
        - name: OUTPUT_DIR
          value: "/outputs"

        # Model configuration
        - name: MODEL_ID
          value: "Qwen/Qwen2.5-VL-7B-Instruct"
        - name: DATASET_PATH
          value: "/outputs/sr_sft_v10_curated/train.jsonl"

        #Qwen MAX_LEN: 3124
        - name: MAX_LEN
          value: "3124"
        - name: IMAGE_MAX_TOKEN_NUM
          value: "2048"

        # Vision tower control (NEW — defaults to true in run script if unset)
        - name: FREEZE_VIT
          value: "false"
        - name: FREEZE_ALIGNER
          value: "false"

        # Training hyperparameters (configurable)
        - name: BATCH
          value: "2"           # Reduced from 4 — ViT activations need extra headroom
        - name: GRAD_ACC
          value: "16"          # Bumped to keep effective batch = 2 * 16 * 4 = 128 (matches frozen run)
        - name: EPOCHS
          value: "3"
        - name: LR
          value: "5e-6"        # Same as frozen run for direct comparison
        - name: WARMUP_RATIO
          value: "0.03"
        - name: WEIGHT_DECAY
          value: "0.01"
        - name: MAX_GRAD_NORM
          value: "1.0"
        - name: LOSS_SCALE
          value: "default"
        - name: DEEPSPEED
          value: "zero2"
        - name: PACKING
          value: "false"

        # DDP configuration
        - name: NPROC
          value: "4"

        - name: NCCL_DEBUG
          value: "WARN"
        - name: NCCL_TIMEOUT
          value: "1800"

        # Output configuration
        - name: RUN_NAME
          value: "qwen-7b-sr-sft-v10-curated-unfrozen-vit"
        - name: RESUME_PATH
          value: ""

        # Logging configuration
        - name: LOGGING_STEPS
          value: "5"
        - name: EVAL_STEPS
          value: "1000000"
        - name: SAVE_STEPS
          value: "25"
        - name: SAVE_TOTAL_LIMIT
          value: "4"

        # Python and CUDA settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

      tolerations:
        - effect: NoSchedule
          key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule
        - key: nautilus.io/issue
          operator: Exists
          effect: NoSchedule

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 200Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
