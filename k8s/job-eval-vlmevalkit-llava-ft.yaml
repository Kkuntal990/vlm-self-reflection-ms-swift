apiVersion: batch/v1
kind: Job
metadata:
  name: eval-vlmevalkit-llava-ft
  labels:
    app: ms-swift
    task: benchmark-evaluation
    framework: vlmevalkit
    model: llava-1-5-7b-ft
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ms-swift
        task: benchmark-evaluation
        framework: vlmevalkit
    spec:
      restartPolicy: Never

      containers:
      - name: evaluator
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always

        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "========================================="
          echo "VLMEvalKit Benchmark Evaluation"
          echo "Fine-tuned LLaVA-1.5-7B"
          echo "========================================="
          echo ""
          echo "Model Path:       ${MODEL_PATH}"
          echo "Model Name:       ${MODEL_NAME}"
          echo "System Prompt:    ${SYSTEM_PROMPT}"
          echo "Output Dir:  ${OUTPUT_DIR}"
          echo "Num GPUs:    ${NUM_GPUS}"
          echo "Benchmarks:  ${BENCHMARKS}"
          echo "Batch Size:  ${BATCH_SIZE}"
          echo ""

          # Verify GPU availability
          echo "GPU Status:"
          nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv
          echo ""

          # Verify model path (local dir or HuggingFace model ID)
          if [ -d "${MODEL_PATH}" ]; then
            echo "Local model checkpoint found:"
            ls -lh "${MODEL_PATH}/" | head -5
          else
            echo "MODEL_PATH is not a local directory: ${MODEL_PATH}"
            echo "Treating as HuggingFace model ID (will download at runtime)..."
          fi
          echo ""

          # Create output directory
          mkdir -p "${OUTPUT_DIR}"

          # Setup VLMEvalKit
          VLMEVALKIT_DIR="/tmp/VLMEvalKit"
          if [ ! -d "${VLMEVALKIT_DIR}" ]; then
            git clone https://github.com/open-compass/VLMEvalKit.git "${VLMEVALKIT_DIR}"
          fi
          pip install --index-url https://pypi.org/simple num2words openai-clip || true
          pip install -e "${VLMEVALKIT_DIR}" || exit 1

          # Patch llava_hf_wrapper.py to support system_prompt before registration copies it
          python3 << 'PATCH_WRAPPER'
          import re
          wrapper_path = "/workspace/scripts/evaluation/llava_hf_wrapper.py"
          with open(wrapper_path) as f:
              code = f.read()

          # Add system_prompt parameter to __init__
          if "system_prompt" not in code:
              code = code.replace(
                  'def __init__(self, model_path: str, base_model_path: str = "", **kwargs) -> None:',
                  'def __init__(self, model_path: str, base_model_path: str = "", system_prompt: str = "", **kwargs) -> None:'
              )
              code = code.replace(
                  'self.model_path = model_path',
                  'self.model_path = model_path\n        self.system_prompt = system_prompt'
              )
              # Add system message to conversation in generate_inner
              code = code.replace(
                  '# Format as conversation for LLaVA-1.5\n        conversation = [\n            {\n                "role": "user",',
                  '# Format as conversation for LLaVA-1.5\n        conversation = []\n        if self.system_prompt:\n            conversation.append({"role": "system", "content": [{"type": "text", "text": self.system_prompt}]})\n        conversation.append({\n                "role": "user",'
              )
              code = code.replace(
                  '+ [{"type": "text", "text": prompt.replace("<image>", "").strip()}],\n            }\n        ]',
                  '+ [{"type": "text", "text": prompt.replace("<image>", "").strip()}],\n        })'
              )
              with open(wrapper_path, 'w') as f:
                  f.write(code)
              print("Patched llava_hf_wrapper.py with system_prompt support")
          else:
              print("llava_hf_wrapper.py already has system_prompt support")
          PATCH_WRAPPER

          # Register model (without system_prompt flag — old script doesn't support it for llava)
          python /workspace/scripts/evaluation/register_vlmevalkit_model.py \
            --model-path "${MODEL_PATH}" \
            --model-name "${MODEL_NAME}" \
            --model-class llava \
            --vlmevalkit-dir "${VLMEVALKIT_DIR}"

          # Patch the registered config entry to add system_prompt (using repr() to safely escape quotes)
          python3 << 'PATCH_CONFIG'
          import os
          config_path = os.environ.get('VLMEVALKIT_DIR', '/tmp/VLMEvalKit') + '/vlmeval/config.py'
          model_name = os.environ.get('MODEL_NAME', '')
          system_prompt = os.environ.get('SYSTEM_PROMPT', '')
          model_path = os.environ.get('MODEL_PATH', '')
          if system_prompt:
              with open(config_path) as f:
                  content = f.read()
              old_entry = f"model_path='{model_path}')"
              if old_entry in content:
                  new_entry = f"model_path='{model_path}', system_prompt={repr(system_prompt)})"
                  content = content.replace(old_entry, new_entry)
                  with open(config_path, 'w') as f:
                      f.write(content)
                  print(f"Patched config.py: added system_prompt for {model_name}")
              else:
                  print(f"WARNING: could not find model entry in config.py")
          PATCH_CONFIG

          # Create .env for API access
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}" > "${VLMEVALKIT_DIR}/.env"
            echo "OPENAI_API_BASE=${OPENAI_API_BASE}" >> "${VLMEVALKIT_DIR}/.env"
          fi

          # Run VLMEvalKit evaluation
          echo "Starting VLMEvalKit evaluation..."
          torchrun --nproc-per-node=${NUM_GPUS} ${VLMEVALKIT_DIR}/run.py \
            --data MMBench_DEV_EN MME SEEDBench_IMG MMMU_DEV_VAL MMVet AI2D_TEST OCRBench MathVista_MINI GQA_TestDev_Balanced ScienceQA_TEST ChartQA_TEST HallusionBench LLaVA_Bench MMHal \
            --model ${MODEL_NAME} \
            --work-dir ${OUTPUT_DIR} \
            --verbose \
            --reuse \
            --judge gpt-4o-mini

          echo ""
          echo "========================================="
          echo "VLMEvalKit Evaluation Complete"
          echo "========================================="
          echo "Results saved to: ${OUTPUT_DIR}"
          ls -lhR "${OUTPUT_DIR}/"

        env:
        # HuggingFace token
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # OpenAI-compatible API (for GPT-based answer extraction in VLMEvalKit)
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key
              key: key
              optional: true
        - name: OPENAI_API_BASE
          value: "https://openrouter.ai/api/v1/chat/completions"

        # Cache directories
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: HF_DATASETS_CACHE
          value: "/cache/hf/datasets"
        - name: TORCH_HOME
          value: "/cache/torch"

        # Evaluation configuration
        - name: MODEL_PATH
          value: "/outputs/llava-7b-fire-full-sft-mixed-dataset-v1/v1-20260326-161426/checkpoint-2035"
        - name: MODEL_NAME
          value: "LLaVA-1.5-7B-FireSFT-Mixed"
        - name: OUTPUT_DIR
          value: "/outputs/benchmark_results/vlmevalkit_llava_ft"
        - name: NUM_GPUS
          value: "1"
        - name: BENCHMARKS
          value: "llava_bench,mmhal"
        - name: BATCH_SIZE
          value: "1"

        # System prompt for fine-tuned model
        - name: SYSTEM_PROMPT
          value: 'You are a helpful vision-language assistant. You should produce accurate, detailed, and grounded answers based on the image and the user''s instructions. When given feedback, critique, or scores, revise your response to improve correctness, specificity, and completeness.'

        # Python and CUDA settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

        resources:
          requests:
            nvidia.com/rtxa6000: "1"
            memory: "32Gi"
            cpu: "2"
          limits:
            nvidia.com/rtxa6000: "1"
            memory: "32Gi"
            cpu: "2"

        volumeMounts:
        - name: outputs-volume
          mountPath: /outputs
        - name: cache-volume
          mountPath: /cache
        - name: dev-shm
          mountPath: /dev/shm

      tolerations:
        - effect: NoSchedule
          key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 200Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
