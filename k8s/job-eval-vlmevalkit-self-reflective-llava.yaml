apiVersion: batch/v1
kind: Job
metadata:
  name: eval-vlmevalkit-self-reflective-llava
  labels:
    app: ms-swift
    task: benchmark-evaluation
    framework: vlmevalkit
    mode: self-reflective
    model: llava-1-5-7b-ft
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ms-swift
        task: benchmark-evaluation
        framework: vlmevalkit
        mode: self-reflective
    spec:
      restartPolicy: Never

      containers:
      - name: evaluator
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always

        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "========================================="
          echo "VLMEvalKit Self-Reflective Evaluation"
          echo "LLaVA-1.5-7B Fine-Tuned"
          echo "========================================="
          echo ""
          echo "Model Path:       ${MODEL_PATH}"
          echo "Model Name:       ${MODEL_NAME}"
          echo "Output Dir:       ${OUTPUT_DIR}"
          echo "Num Turns:        ${NUM_TURNS}"
          echo "Benchmarks:       ${BENCHMARKS}"
          echo ""

          # Verify GPU
          nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv
          echo ""

          if [ -d "${MODEL_PATH}" ]; then
            echo "Local model checkpoint found:"
            ls -lh "${MODEL_PATH}/" | head -5
          else
            echo "Treating as HuggingFace model ID..."
          fi
          echo ""

          mkdir -p "${OUTPUT_DIR}"

          # Setup VLMEvalKit
          VLMEVALKIT_DIR="/tmp/VLMEvalKit"
          if [ ! -d "${VLMEVALKIT_DIR}" ]; then
            git clone https://github.com/open-compass/VLMEvalKit.git "${VLMEVALKIT_DIR}"
          fi
          pip install --index-url https://pypi.org/simple num2words openai-clip || true
          pip install -e "${VLMEVALKIT_DIR}" || exit 1

          # Write LLaVA self-reflective wrapper into VLMEvalKit
          python3 << 'WRAPPER_EOF'
          import os
          wrapper_code = '''
          from __future__ import annotations
          import json
          import logging
          import os
          import torch
          from vlmeval.vlm.base import BaseModel
          from PIL import Image

          logger = logging.getLogger(__name__)

          _DEFAULT_VL_ASSISTANT_PROMPT = (
              "You are a helpful vision-language assistant. You should produce accurate, "
              "detailed, and grounded answers based on the image and the user's "
              "instructions. When given feedback, critique, or scores, revise your "
              "response to improve correctness, specificity, and completeness."
          )

          _DEFAULT_FEEDBACK_CRITIC_PROMPT = (
              "You are a vision-language critic that evaluates answers to visual "
              "questions and helps improve them. Use the image, question, and dialogue "
              "history to judge the latest answer by: - correctness and visual grounding "
              "(matches what is visible / implied), - compliance with the requested format "
              "(option letter, units, etc.), - completeness. Be conservative: confirm "
              "the answer as correct if it is consistent with the image/question and "
              "follows the required format. Only say incorrect when you can name a "
              "specific contradiction or missing requirement. If you are uncertain, do "
              "not guess. Write a brief natural paragraph: start with a clear verdict, "
              "give 1-2 grounded reasons, and (if needed) one practical next step."
          )

          def LLaVASelfReflectiveChat(*args, **kwargs):
              return _LLaVASelfReflectiveChat(*args, **kwargs)

          class _LLaVASelfReflectiveChat(BaseModel):
              INSTALL_REQ = False
              INTERLEAVE = False

              def __init__(self, model_path, num_turns=1, feedback_max_tokens=512,
                           vl_system_prompt=None, critic_system_prompt=None,
                           feedback_temperature=0.7, conversation_log_path=None, **kwargs):
                  from transformers import AutoProcessor, LlavaForConditionalGeneration

                  self.model_path = model_path
                  self.num_turns = num_turns
                  self.feedback_max_tokens = feedback_max_tokens
                  self.feedback_temperature = feedback_temperature
                  self.vl_system_prompt = vl_system_prompt or os.environ.get(
                      "VL_ASSISTANT_SYSTEM_PROMPT", _DEFAULT_VL_ASSISTANT_PROMPT)
                  self.critic_system_prompt = critic_system_prompt or os.environ.get(
                      "FEEDBACK_CRITIC_SYSTEM_PROMPT", _DEFAULT_FEEDBACK_CRITIC_PROMPT)
                  self.conversation_log_path = conversation_log_path or os.environ.get(
                      "CONVERSATION_LOG_PATH", None)
                  self._sample_counter = 0

                  self.processor = AutoProcessor.from_pretrained(model_path)

                  attn_kwargs = {}
                  try:
                      import flash_attn
                      attn_kwargs["attn_implementation"] = "flash_attention_2"
                  except ImportError:
                      pass

                  self.model = LlavaForConditionalGeneration.from_pretrained(
                      model_path, dtype=torch.float16, low_cpu_mem_usage=True, **attn_kwargs
                  ).eval().cuda()

                  self.gen_kwargs = dict(do_sample=False, temperature=0, max_new_tokens=2048,
                                         top_p=None, num_beams=1)
                  logger.info(f"LLaVA self-reflective wrapper: num_turns={num_turns}, log={self.conversation_log_path}")

              def _generate_from_conversation(self, conversation, pil_images, max_new_tokens=None):
                  gen_kw = dict(self.gen_kwargs)
                  if max_new_tokens is not None:
                      gen_kw["max_new_tokens"] = max_new_tokens

                  text_prompt = self.processor.apply_chat_template(conversation, add_generation_prompt=True)
                  if pil_images:
                      inputs = self.processor(text=text_prompt, images=pil_images, return_tensors="pt"
                      ).to(self.model.device, torch.float16)
                  else:
                      inputs = self.processor(text=text_prompt, return_tensors="pt"
                      ).to(self.model.device, torch.float16)

                  with torch.no_grad():
                      output = self.model.generate(**inputs, **gen_kw)
                  generated = output[0][inputs["input_ids"].shape[1]:]
                  return self.processor.decode(generated, skip_special_tokens=True).strip()

              def generate_inner(self, message, dataset=None):
                  # Extract images and text from VLMEvalKit message format
                  pil_images = []
                  prompt_parts = []
                  for item in message:
                      if item["type"] == "image":
                          pil_images.append(Image.open(item["value"]).convert("RGB"))
                          prompt_parts.append("<image>")
                      elif item["type"] == "text":
                          prompt_parts.append(item["value"])
                  question_text = "\\n".join(prompt_parts).replace("<image>", "").strip()

                  # Build initial single-turn conversation
                  image_content = [{"type": "image"} for _ in pil_images]
                  init_conv = []
                  if self.vl_system_prompt:
                      init_conv.append({"role": "system", "content": [{"type": "text", "text": self.vl_system_prompt}]})
                  init_conv.append({"role": "user", "content": image_content + [{"type": "text", "text": question_text}]})

                  initial_answer = self._generate_from_conversation(init_conv, pil_images)

                  if self.num_turns <= 0:
                      return initial_answer

                  conversation = {
                      "sample_id": self._sample_counter,
                      "dataset": dataset,
                      "question": question_text,
                      "initial_answer": initial_answer,
                      "turns": [],
                  }
                  self._sample_counter += 1
                  current_answer = initial_answer

                  for turn_idx in range(self.num_turns):
                      # Feedback: critic mode, flipped roles
                      feedback_conv = []
                      feedback_conv.append({"role": "system", "content": [{"type": "text", "text": self.critic_system_prompt}]})
                      feedback_conv.append({"role": "assistant", "content": image_content + [{"type": "text", "text": question_text}]})
                      feedback_conv.append({"role": "user", "content": [{"type": "text", "text": current_answer}]})

                      orig_temp = self.gen_kwargs.get("temperature", 0)
                      self.gen_kwargs["temperature"] = self.feedback_temperature
                      self.gen_kwargs["do_sample"] = self.feedback_temperature > 0
                      feedback = self._generate_from_conversation(feedback_conv, pil_images, max_new_tokens=self.feedback_max_tokens)
                      self.gen_kwargs["temperature"] = orig_temp
                      self.gen_kwargs["do_sample"] = False

                      logger.info(f"Turn {turn_idx+1} feedback: {feedback[:120]}")

                      # Refinement: VL assistant mode, accumulated history
                      refine_conv = []
                      if self.vl_system_prompt:
                          refine_conv.append({"role": "system", "content": [{"type": "text", "text": self.vl_system_prompt}]})
                      refine_conv.append({"role": "user", "content": image_content + [{"type": "text", "text": question_text}]})
                      refine_conv.append({"role": "assistant", "content": [{"type": "text", "text": current_answer}]})
                      refine_conv.append({"role": "user", "content": [{"type": "text", "text": feedback}]})

                      refined = self._generate_from_conversation(refine_conv, pil_images)
                      logger.info(f"Turn {turn_idx+1} refined: {refined[:120]}")

                      conversation["turns"].append({
                          "turn": turn_idx + 1,
                          "answer_before": current_answer,
                          "feedback": feedback,
                          "answer_after": refined,
                      })
                      current_answer = refined

                  conversation["final_answer"] = current_answer
                  self._log_conversation(conversation)
                  return current_answer

              def _log_conversation(self, conversation):
                  if not self.conversation_log_path:
                      return
                  try:
                      os.makedirs(os.path.dirname(self.conversation_log_path), exist_ok=True)
                      with open(self.conversation_log_path, "a") as f:
                          f.write(json.dumps(conversation, ensure_ascii=False) + "\\n")
                  except Exception as e:
                      logger.warning(f"Failed to write conversation log: {e}")
          '''
          import textwrap
          vlmevalkit_dir = os.environ.get('VLMEVALKIT_DIR', '/tmp/VLMEvalKit')
          wrapper_path = f'{vlmevalkit_dir}/vlmeval/vlm/llava_self_reflective.py'
          with open(wrapper_path, 'w') as f:
              f.write(textwrap.dedent(wrapper_code))
          print(f'Wrote LLaVA self-reflective wrapper to {wrapper_path}')

          # Register in config
          model_path = os.environ['MODEL_PATH']
          model_name = os.environ['MODEL_NAME']
          num_turns = int(os.environ.get('NUM_TURNS', '1'))
          feedback_temp = float(os.environ.get('FEEDBACK_TEMPERATURE', '0.7'))
          config_path = f'{vlmevalkit_dir}/vlmeval/config.py'
          with open(config_path) as f:
              content = f.read()
          if model_name not in content:
              content += (
                  f"\n# Self-reflective LLaVA model\n"
                  f"from vlmeval.vlm.llava_self_reflective import LLaVASelfReflectiveChat\n"
                  f"supported_VLM['{model_name}'] = partial(\n"
                  f"    LLaVASelfReflectiveChat,\n"
                  f"    model_path='{model_path}',\n"
                  f"    num_turns={num_turns},\n"
                  f"    feedback_temperature={feedback_temp},\n"
                  f")\n"
              )
              with open(config_path, 'w') as f:
                  f.write(content)
              print(f"Registered '{model_name}' (num_turns={num_turns})")
          else:
              print(f"'{model_name}' already registered")
          WRAPPER_EOF

          # Create .env for API access
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}" > "${VLMEVALKIT_DIR}/.env"
            echo "OPENAI_API_BASE=${OPENAI_API_BASE}" >> "${VLMEVALKIT_DIR}/.env"
          fi

          # Run VLMEvalKit
          echo "Starting VLMEvalKit self-reflective evaluation (LLaVA)..."
          echo "Each sample will do ${NUM_TURNS} feedback-refinement cycle(s)."
          echo ""
          torchrun --nproc-per-node=${NUM_GPUS} ${VLMEVALKIT_DIR}/run.py \
            --data ${BENCHMARKS} \
            --model ${MODEL_NAME} \
            --work-dir ${OUTPUT_DIR} \
            --verbose \
            --judge gpt-4o-mini

          echo ""
          echo "========================================="
          echo "Self-Reflective Evaluation Complete"
          echo "========================================="
          echo "Results saved to: ${OUTPUT_DIR}"
          ls -lhR "${OUTPUT_DIR}/"

        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key
              key: key
              optional: true
        - name: OPENAI_API_BASE
          value: "https://openrouter.ai/api/v1/chat/completions"
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: HF_DATASETS_CACHE
          value: "/cache/hf/datasets"
        - name: TORCH_HOME
          value: "/cache/torch"

        # Evaluation configuration
        - name: MODEL_PATH
          value: "/outputs/llava-7b-fire-full-sft-mixed-dataset-v1/v1-20260326-161426/checkpoint-2035"
        - name: MODEL_NAME
          value: "LLaVA-1.5-7B-FireSFT-SelfReflective"
        - name: OUTPUT_DIR
          value: "/outputs/benchmark_results/vlmevalkit_self_reflective_llava"
        - name: NUM_GPUS
          value: "1"
        - name: BENCHMARKS
          value: "MMVet MathVerse_MINI MathVision_MINI HallusionBench"
        - name: BATCH_SIZE
          value: "1"

        # Self-reflection parameters
        - name: NUM_TURNS
          value: "1"
        - name: FEEDBACK_TEMPERATURE
          value: "0.7"
        - name: CONVERSATION_LOG_PATH
          value: "/outputs/benchmark_results/vlmevalkit_self_reflective_llava/conversation_log.jsonl"

        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

        resources:
          requests:
            nvidia.com/rtxa6000: "1"
            memory: "32Gi"
            cpu: "2"
          limits:
            nvidia.com/rtxa6000: "1"
            memory: "32Gi"
            cpu: "2"

        volumeMounts:
        - name: outputs-volume
          mountPath: /outputs
        - name: cache-volume
          mountPath: /cache
        - name: dev-shm
          mountPath: /dev/shm

      tolerations:
        - effect: NoSchedule
          key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 200Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
