apiVersion: v1
kind: Pod
metadata:
  name: vlm-jupyter
  labels:
    app: ms-swift
    task: fire-full-sft-test
    model: qwen2-5-vl-7b
    gpu: a100
spec:
  restartPolicy: Never
  containers:
  - name: jupyter-container
    image: ghcr.io/kkuntal990/ms-swift-qwen:latest
    imagePullPolicy: Always
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--no-browser", "--allow-root", "--NotebookApp.token=selfimprove"]

    resources:
      requests:
        nvidia.com/a100: "0"
        memory: "32Gi"
        cpu: "4"
      limits:
        nvidia.com/a100: "0"
        memory: "32Gi"
        cpu: "4"

    volumeMounts:
    - name: cache-volume
      mountPath: /cache
    - name: outputs-volume
      mountPath: /outputs
    - name: dev-shm
      mountPath: /dev/shm

    env:
    # HuggingFace token (required for gated models)
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token
          key: token
          optional: true

    # Cache directories (from scripts/env.sh)
    - name: HF_HOME
      value: "/cache/hf"
    - name: TRANSFORMERS_CACHE
      value: "/cache/hf/transformers"
    - name: HF_DATASETS_CACHE
      value: "/cache/hf/datasets"
    - name: TORCH_HOME
      value: "/cache/torch"
    - name: PIP_CACHE_DIR
      value: "/cache/pip"
    - name: OUTPUT_DIR
      value: "/outputs"

    # Model configuration
    - name: MODEL_ID
      value: "Qwen/Qwen2.5-VL-7B-Instruct"
    - name: DATASET_PATH
      value: "/outputs/fire_bc/fire_sharegpt_train.jsonl"

    # Sequence configuration
    - name: MAX_LEN
      value: "8192"
    - name: IMAGE_MAX_TOKEN_NUM
      value: "2048"


    # Training hyperparameters (configurable)
    - name: BATCH
      value: "4"           # Per-GPU batch size (adjust based on memory)
    - name: GRAD_ACC
      value: "8"           # Gradient accumulation steps
    - name: EPOCHS
      value: "100"           # Number of training epochs
    - name: LR
      value: "5e-6"        # Learning rate (lower for full fine-tuning)
    - name: WARMUP_RATIO
      value: "0.03"        # Warmup ratio
    - name: WEIGHT_DECAY
      value: "0.01"        # Weight decay
    - name: MAX_GRAD_NORM
      value: "1.0"         # Gradient clipping
    - name: LOSS_SCALE
      value: "last_round"

    # DDP configuration
    - name: NPROC
      value: "0"           # Number of GPUs

    # Output configuration
    - name: RUN_NAME
      value: "qwen2_5vl-7b-fire-full-sft-4gpu"

    # Logging configuration
    - name: LOGGING_STEPS
      value: "10"
    - name: EVAL_STEPS
      value: "20"
    - name: SAVE_STEPS
      value: "25"
    - name: SAVE_TOTAL_LIMIT
      value: "2"

    # Python and CUDA settings
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: "expandable_segments:True"

  tolerations:
    - effect: NoSchedule
      key: nautilus.io/hardware
      operator: Equal
      value: large-gpu
    - effect: PreferNoSchedule
      key: nvidia.com/gpu
      operator: Exists

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: nvidia.com/gpu.product
            operator: In
            values:
            - NVIDIA-A100-SXM4-80GB

  volumes:
  - name: cache-volume
    persistentVolumeClaim:
      claimName: ms-swift-cache-pvc
  - name: outputs-volume
    persistentVolumeClaim:
      claimName: ms-swift-outputs-pvc
  - name: dev-shm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
