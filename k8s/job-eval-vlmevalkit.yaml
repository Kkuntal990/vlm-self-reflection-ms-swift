apiVersion: batch/v1
kind: Job
metadata:
  name: eval-vlmevalkit-llava-7b-sft
  labels:
    app: ms-swift
    task: benchmark-evaluation
    framework: vlmevalkit
    model: llava-7b-sft
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ms-swift
        task: benchmark-evaluation
        framework: vlmevalkit
    spec:
      restartPolicy: Never

      containers:
      - name: evaluator
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always

        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "========================================="
          echo "VLMEvalKit Benchmark Evaluation"
          echo "========================================="
          echo ""
          echo "Model Path:  ${MODEL_PATH}"
          echo "Model Name:  ${MODEL_NAME}"
          echo "Output Dir:  ${OUTPUT_DIR}"
          echo "Num GPUs:    ${NUM_GPUS}"
          echo "Benchmarks:  ${BENCHMARKS}"
          echo "Batch Size:  ${BATCH_SIZE}"
          echo "Limit:       ${LIMIT} (0 = all)"
          echo ""

          # Verify GPU availability
          echo "GPU Status:"
          nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv
          echo ""

          # Verify model checkpoint exists
          if [ ! -d "${MODEL_PATH}" ]; then
            echo "ERROR: Model checkpoint not found: ${MODEL_PATH}"
            exit 1
          fi
          echo "Model checkpoint found:"
          ls -lh "${MODEL_PATH}/" | head -5
          echo ""

          # Create output directory
          mkdir -p "${OUTPUT_DIR}"

          # Run evaluation using the unified script
          echo "Starting VLMEvalKit evaluation..."
          echo ""

          bash /workspace/scripts/evaluation/run_vlm_benchmarks.sh \
            --framework vlmevalkit \
            --model-path "${MODEL_PATH}" \
            --model-name "${MODEL_NAME}" \
            --output-dir "${OUTPUT_DIR}" \
            --num-gpus "${NUM_GPUS}" \
            --benchmarks "${BENCHMARKS}" \
            --batch-size "${BATCH_SIZE}" \
            --limit "${LIMIT}"

          echo ""
          echo "========================================="
          echo "VLMEvalKit Evaluation Complete"
          echo "========================================="
          echo "Results saved to: ${OUTPUT_DIR}"
          ls -lhR "${OUTPUT_DIR}/"

        env:
        # HuggingFace token
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # Cache directories
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: HF_DATASETS_CACHE
          value: "/cache/hf/datasets"
        - name: TORCH_HOME
          value: "/cache/torch"

        # Evaluation configuration
        - name: MODEL_PATH
          value: "/outputs/llava-7b-fire-full-sft-multi-and-single-turn/v1-20260208-031459/checkpoint-1856"
        - name: MODEL_NAME
          value: "FireSFT-LLaVA-7B"
        - name: OUTPUT_DIR
          value: "/outputs/benchmark_results/vlmevalkit"
        - name: NUM_GPUS
          value: "2"
        - name: BENCHMARKS
          value: "all"
        - name: BATCH_SIZE
          value: "1"
        - name: LIMIT
          value: "0"

        # Python and CUDA settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

        resources:
          requests:
            nvidia.com/rtxa6000: "2"
            memory: "32Gi"
            cpu: "4"
          limits:
            nvidia.com/rtxa6000: "2"
            memory: "32Gi"
            cpu: "4"

        volumeMounts:
        - name: outputs-volume
          mountPath: /outputs
        - name: cache-volume
          mountPath: /cache
        - name: dev-shm
          mountPath: /dev/shm

      tolerations:
        - effect: NoSchedule
          key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule
        - key: nautilus.io/issue
          operator: Exists
          effect: NoSchedule

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 200Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
