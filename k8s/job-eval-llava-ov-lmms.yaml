apiVersion: batch/v1
kind: Job
metadata:
  name: eval-llava-ov-lmms-single-turn-feedback
  labels:
    app: ms-swift
    task: benchmark-evaluation
    framework: lmms-eval
    model: llava-ov
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ms-swift
        task: benchmark-evaluation
        framework: lmms-eval
    spec:
      restartPolicy: Never

      containers:
      - name: evaluator
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always

        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "========================================="
          echo "LLaVA-OV lmms-eval Benchmark Evaluation"
          echo "========================================="
          echo ""
          echo "Model Path:  ${MODEL_PATH}"
          echo "Output Dir:  ${OUTPUT_DIR}"
          echo "Num GPUs:    ${NUM_GPUS}"
          echo "Benchmarks:  ${BENCHMARKS}"
          echo "Limit:       ${LIMIT} (0 = all)"
          echo ""

          # Verify GPU availability
          echo "GPU Status:"
          nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv
          echo ""

          # Verify model path
          if [ -d "${MODEL_PATH}" ]; then
            echo "Local model checkpoint found:"
            ls -lh "${MODEL_PATH}/" | head -5
          else
            echo "MODEL_PATH is not a local directory: ${MODEL_PATH}"
            echo "Treating as HuggingFace model ID (will download at runtime)..."
          fi
          echo ""

          # Create output directory
          mkdir -p "${OUTPUT_DIR}"

          # Run evaluation using the dedicated LLaVA-OV script
          echo "Starting LLaVA-OV evaluation..."
          echo ""

          bash /workspace/scripts/evaluation/run_llava_ov_benchmarks.sh \
            --model-path "${MODEL_PATH}" \
            --output-dir "${OUTPUT_DIR}" \
            --num-gpus "${NUM_GPUS}" \
            --benchmarks "${BENCHMARKS}" \
            --limit "${LIMIT}"

          echo ""
          echo "========================================="
          echo "LLaVA-OV Evaluation Complete"
          echo "========================================="
          echo "Results saved to: ${OUTPUT_DIR}"
          ls -lhR "${OUTPUT_DIR}/"

        env:
        # HuggingFace token
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # Cache directories
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: HF_DATASETS_CACHE
          value: "/cache/hf/datasets"
        - name: TORCH_HOME
          value: "/cache/torch"

        # Evaluation configuration
        - name: MODEL_PATH
          value: "llava-hf/llava-1.5-7b-hf"
        - name: OUTPUT_DIR
          value: "/outputs/benchmark_results/llava_1_5_lmms_eval"
        - name: NUM_GPUS
          value: "4"
        - name: BENCHMARKS
          value: "all"
        - name: LIMIT
          value: "0"

        # Python and CUDA settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

        resources:
          requests:
            nvidia.com/rtxa6000: "4"
            memory: "128Gi"
            cpu: "8"
          limits:
            nvidia.com/rtxa6000: "4"
            memory: "128Gi"
            cpu: "8"

        volumeMounts:
        - name: cache-volume
          mountPath: /cache
        - name: outputs-volume
          mountPath: /outputs
        - name: dev-shm
          mountPath: /dev/shm

      tolerations:
        - effect: NoSchedule
          key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule
        - key: nautilus.io/issue
          operator: Exists
          effect: NoSchedule

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 200Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
