apiVersion: batch/v1
kind: Job
metadata:
  name: fire-preprocess-cpu-job
  labels:
    app: ms-swift
    task: fire-preprocessing
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ms-swift
        task: fire-preprocessing
    spec:
      containers:
      - name: fire-preprocessor
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always

        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "========================================="
          echo "FIRE Dataset Preprocessing (CPU-only)"
          echo "ShareGPT Format Conversion with Mapping"
          echo "Lazy Loading (Memory Efficient)"
          echo "========================================="
          echo ""
          echo "Dataset: ${DATASET_ID}"
          echo "Mapping file: /outputs/fire_image_mapping_complete.json"
          echo "Splits: ${SPLITS}"
          echo "Max samples: ${MAX_SAMPLES} (0 = all)"
          echo ""

          # Verify mapping file exists
          if [ ! -f /outputs/fire_image_mapping_complete.json ]; then
            echo "ERROR: Complete mapping file not found!"
            echo "Expected: /outputs/fire_image_mapping_complete.json"
            echo "This should be created by merging HF and local mappings."
            exit 1
          fi

          echo "Mapping file found ($(du -h /outputs/fire_image_mapping_complete.json | cut -f1))"
          echo ""

          # Run preprocessing with complete mapping (HF + local images)
          # Uses lazy loading for memory efficiency
          # Includes Vision-FLAN (20,257 images) and GeoQA+ (2,253 images)

          echo "Processing TRAIN and TEST splits with complete mapping..."
          python /workspace/scripts/data_prep/prepare_fire_sharegpt.py \
            --dataset_id "${DATASET_ID}" \
            --output_dir /outputs/fire_preprocessed_v2 \
            --image_dir /outputs/fire_images_v2 \
            --mapping_file /outputs/fire_image_mapping_complete.json \
            --max_samples ${MAX_SAMPLES} \
            --splits train test

          echo ""
          echo "========================================="
          echo "Preprocessing Complete"
          echo "========================================="
          echo ""
          echo "Output files:"
          ls -lh /outputs/fire_preprocessed_v2/
          echo ""
          echo "Sample counts:"
          wc -l /outputs/fire_preprocessed_v2/fire_sharegpt_*.jsonl 2>/dev/null || echo "No JSONL files found"
          echo ""
          echo "Statistics:"
          cat /outputs/fire_preprocessed_v2/stats.json
          echo ""
          if [ -f /outputs/fire_preprocessed_v2/fire_sharegpt_train.jsonl ]; then
            echo "First training example:"
            head -1 /outputs/fire_preprocessed_v2/fire_sharegpt_train.jsonl | python -m json.tool
            echo ""
          fi
          echo "Ready for training! Submit job-sft-qwen3vl-fire-4gpu.yaml"
          echo "========================================="

        env:
        # HuggingFace token (optional for public datasets)
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # Dataset configuration
        - name: DATASET_ID
          value: "PengxiangLi/FIRE"

        # Preprocessing configuration
        - name: SPLITS
          value: "train test"  # Both splits processed with lazy loading

        - name: MAX_SAMPLES
          value: "0"  # Testing with 100 samples first, then set to "0" for full run

        resources:
          requests:
            memory: "64Gi"
            cpu: "2"
          limits:
            memory: "64Gi"
            cpu: "2"

        volumeMounts:
        - name: cache-volume
          mountPath: /cache
        - name: outputs-volume
          mountPath: /outputs

      restartPolicy: Never

      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: ms-swift-cache-pvc
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
