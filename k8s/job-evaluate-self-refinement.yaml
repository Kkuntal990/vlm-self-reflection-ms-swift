apiVersion: batch/v1
kind: Job
metadata:
  name: self-refinement-evaluation-job-training-prompts-v2
  labels:
    app: ms-swift
    task: self-refinement-evaluation
    model: qwen2-5-vl-7b
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ms-swift
        task: self-refinement-evaluation
    spec:
      restartPolicy: Never

      containers:
      - name: evaluator
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always

        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "========================================="
          echo "Self-Reflective Inference V2 Pipeline"
          echo "========================================="
          echo ""
          echo "Model Path: ${MODEL_PATH}"
          echo "Dataset: ${DATASET_PATH}"
          echo "Output: ${OUTPUT_PATH}"
          echo "Image Base Dir: ${IMAGE_BASE_DIR}"
          echo "Start Index: ${START_INDEX}"
          echo "Max Samples: ${MAX_SAMPLES} (0 = all)"
          echo "Num Turns: ${NUM_TURNS} (0 = use ground truth)"
          echo "Temperature: ${TEMPERATURE}"
          echo "Feedback Temperature: ${FEEDBACK_TEMPERATURE}"
          echo ""

          # Verify GPU availability
          echo "GPU Status:"
          nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv
          echo ""

          # Verify dataset exists
          if [ ! -f "${DATASET_PATH}" ]; then
            echo "ERROR: Test dataset not found: ${DATASET_PATH}"
            exit 1
          fi

          echo "Dataset found:"
          ls -lh "${DATASET_PATH}"
          echo "Sample count: $(wc -l < "${DATASET_PATH}")"
          echo ""

          # Verify model checkpoint exists
          if [ ! -d "${MODEL_PATH}" ] && [ ! -f "${MODEL_PATH}/config.json" ]; then
            echo "WARNING: Model checkpoint not found at ${MODEL_PATH}"
            echo "Checking if it's a HuggingFace model ID..."
          else
            echo "Model checkpoint found:"
            ls -lh "${MODEL_PATH}/" | head -5
            echo ""
          fi

          # Create output directory
          mkdir -p "$(dirname "${OUTPUT_PATH}")"

          # Run self-reflective inference
          echo "Starting self-reflective inference..."
          echo ""

          python /workspace/scripts/evaluation/self_reflective_inference_v2.py \
            --model_path "${MODEL_PATH}" \
            --dataset_path "${DATASET_PATH}" \
            --output_path "${OUTPUT_PATH}" \
            --image_base_dir "${IMAGE_BASE_DIR}" \
            --temperature ${TEMPERATURE} \
            --feedback_temperature ${FEEDBACK_TEMPERATURE} \
            --start_index ${START_INDEX} \
            --max_samples ${MAX_SAMPLES} \
            --num_turns ${NUM_TURNS}

          echo ""
          echo "========================================="
          echo "Inference Complete"
          echo "========================================="
          echo ""
          echo "Results saved to: ${OUTPUT_PATH}"
          ls -lh "${OUTPUT_PATH}"
          echo ""

        env:
        # HuggingFace token
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # Cache directories
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: HF_DATASETS_CACHE
          value: "/cache/hf/datasets"
        - name: TORCH_HOME
          value: "/cache/torch"

        # Model and dataset paths
        - name: MODEL_PATH
          value: "/outputs/qwen2_5vl-7b-fire-full-sft-4gpu-feedback-training-single-turn-data2/v18-20260129-161955/checkpoint-3500"
        - name: DATASET_PATH
          value: "/outputs/fire_preprocessed_v3/fire_messages_test.jsonl"
        - name: OUTPUT_PATH
          value: "/outputs/inference_v4/self_reflective_feedback_single_turn_results_all_prompt-v2.jsonl"
        - name: IMAGE_BASE_DIR
          value: "/outputs/image_base"

        # Sampling parameters
        - name: START_INDEX
          value: "0"
        - name: MAX_SAMPLES
          value: "0"
        - name: NUM_TURNS
          value: "1"

        # Generation parameters
        - name: TEMPERATURE
          value: "0.3"
        - name: FEEDBACK_TEMPERATURE
          value: "0"

        # System prompts (optional - defaults are built into the script)
        # Uncomment and modify to override the default prompts
        # - name: VL_ASSISTANT_SYSTEM_PROMPT
        #   value: "You are a helpful vision-language assistant. You should produce accurate, detailed, and grounded answers based on the image and the user's instructions. When given feedback, critique, or scores, revise your response to improve correctness, specificity, and completeness."
        # - name: FEEDBACK_CRITIC_SYSTEM_PROMPT
        #   value: ""

        # Python and CUDA settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

        resources:
          requests:
            nvidia.com/rtxa6000: "1"
            memory: "8Gi"
            cpu: "2"
          limits:
            nvidia.com/rtxa6000: "1"
            memory: "8Gi"
            cpu: "2"

        volumeMounts:
        - name: outputs-volume
          mountPath: /outputs
        - name: dev-shm
          mountPath: /dev/shm

      tolerations:
        - effect: NoSchedule
          key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule
        - key: nautilus.io/issue
          operator: Exists
          effect: NoSchedule

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 100Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
