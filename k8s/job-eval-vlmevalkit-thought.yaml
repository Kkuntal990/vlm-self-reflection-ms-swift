apiVersion: batch/v1
kind: Job
metadata:
  name: eval-vlmevalkit-thought-mt
  labels:
    app: ms-swift
    task: benchmark-evaluation
    framework: vlmevalkit
    model: qwen-7b-rl
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ms-swift
        task: benchmark-evaluation
        framework: vlmevalkit
    spec:
      restartPolicy: Never

      containers:
      - name: evaluator
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always

        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "========================================="
          echo "VLMEvalKit Benchmark Evaluation"
          echo "========================================="
          echo ""
          echo "Model Path:       ${MODEL_PATH}"
          echo "Base Model Path:  ${BASE_MODEL_PATH:-none (full model)}"
          echo "Model Name:       ${MODEL_NAME}"
          echo "Output Dir:  ${OUTPUT_DIR}"
          echo "Num GPUs:    ${NUM_GPUS}"
          echo "Benchmarks:  ${BENCHMARKS}"
          echo "Batch Size:  ${BATCH_SIZE}"
          echo ""

          # Verify GPU availability
          echo "GPU Status:"
          nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv
          echo ""

          # Verify model path (local dir or HuggingFace model ID)
          if [ -d "${MODEL_PATH}" ]; then
            echo "Local model checkpoint found:"
            ls -lh "${MODEL_PATH}/" | head -5
          else
            echo "MODEL_PATH is not a local directory: ${MODEL_PATH}"
            echo "Treating as HuggingFace model ID (will download at runtime)..."
          fi
          echo ""

          # Create output directory
          mkdir -p "${OUTPUT_DIR}"

          # Run evaluation using the unified script
          echo "Starting VLMEvalKit evaluation..."
          echo ""

          EVAL_CMD="bash /workspace/scripts/evaluation/run_vlm_benchmarks.sh \
            --framework vlmevalkit \
            --model-path ${MODEL_PATH} \
            --model-name ${MODEL_NAME} \
            --output-dir ${OUTPUT_DIR} \
            --num-gpus ${NUM_GPUS} \
            --benchmarks ${BENCHMARKS} \
            --batch-size ${BATCH_SIZE}"
          if [ -n "${BASE_MODEL_PATH:-}" ]; then
            EVAL_CMD="${EVAL_CMD} --base-model-path ${BASE_MODEL_PATH}"
          fi
          eval "${EVAL_CMD}"

          echo ""
          echo "========================================="
          echo "VLMEvalKit Evaluation Complete"
          echo "========================================="
          echo "Results saved to: ${OUTPUT_DIR}"
          ls -lhR "${OUTPUT_DIR}/"

        env:
        # HuggingFace token
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # OpenAI-compatible API (for GPT-based answer extraction in VLMEvalKit)
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key
              key: key
              optional: true
        - name: OPENAI_API_BASE
          value: "https://openrouter.ai/api/v1"

        # Cache directories
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: HF_DATASETS_CACHE
          value: "/cache/hf/datasets"
        - name: TORCH_HOME
          value: "/cache/torch"

        # Evaluation configuration
        - name: MODEL_PATH
          #value: "llava-hf/llava-1.5-7b-hf"
          #value: "/outputs/llava-7b-fire-full-sft-multi-and-single-turn/v1-20260208-031459/checkpoint-1856"
          #value: "/outputs/grpo_self_reflection_v1/final"
          value: "/outputs/qwen-7b-fire-sft-thought-v1/v1-20260319-093257/checkpoint-1564"
        - name: BASE_MODEL_PATH
          value: ""
        # - name: MODEL_PATH
        #   #value: "/outputs/llava-7b-fire-full-sft-multi-and-single-turn/v1-20260208-031459/checkpoint-1856"
        #   #value: "/outputs/grpo_self_reflection_v1/final"
        #   value: ""
        # - name: BASE_MODEL_PATH
         # value: "/outputs/llava-7b-fire-full-sft-multi-and-single-turn/v1-20260208-031459/checkpoint-1856"  # Set to base model HF ID/path for LoRA adapter checkpoints
        - name: MODEL_NAME
          #value: "FireSFT-LLaVA-7B"
          value: "QWEN-2-5Vl-thought-MT"
        - name: OUTPUT_DIR
          value: "/outputs/benchmark_results/vlmevalkit"
        - name: NUM_GPUS
          value: "1"
        - name: BENCHMARKS
          value: "mmmu,mmvet,ai2d,ocrbench,mathvista,gqa,scienceqa,chartqa,hallusionbench"
        - name: BATCH_SIZE
          value: "1"

        # Python and CUDA settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

        resources:
          requests:
            nvidia.com/rtxa6000: "1"
            memory: "16Gi"
            cpu: "2"
          limits:
            nvidia.com/rtxa6000: "1"
            memory: "16Gi"
            cpu: "2"

        volumeMounts:
        - name: outputs-volume
          mountPath: /outputs
        - name: cache-volume
          mountPath: /cache
        - name: dev-shm
          mountPath: /dev/shm

      tolerations:
        - effect: NoSchedule
          key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule


      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 200Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
