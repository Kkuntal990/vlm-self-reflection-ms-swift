apiVersion: v1
kind: Pod
metadata:
  name: vlm-jupyter-eval
  labels:
    app: ms-swift
    task: evaluation-testing
spec:
  restartPolicy: Never
  containers:
  - name: jupyter-container
    image: ghcr.io/kkuntal990/ms-swift-qwen:latest
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--no-browser", "--allow-root", "--NotebookApp.token=selfimprove"]

    resources:
      limits:
        nvidia.com/rtxa6000: "1"
        memory: "16Gi"
        cpu: "2"
      requests:
        nvidia.com/rtxa6000: "1"
        memory: "16Gi"
        cpu: "2"

    volumeMounts:
      - name: cache-volume
        mountPath: /cache
      - name: outputs-volume
        mountPath: /outputs
      - name: dev-shm
        mountPath: /dev/shm

    env:
    # HuggingFace token (required for reward model)
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token
          key: token
          optional: true

    # Cache directories
    - name: HF_HOME
      value: "/cache/hf"
    - name: TRANSFORMERS_CACHE
      value: "/cache/hf/transformers"
    - name: HF_DATASETS_CACHE
      value: "/cache/hf/datasets"
    - name: TORCH_HOME
      value: "/cache/torch"
    - name: PIP_CACHE_DIR
      value: "/cache/pip"
    - name: OUTPUT_DIR
      value: "/outputs"

    # ============================================
    # EVALUATION CONFIGURATION
    # ============================================

    # Evaluation mode: "ground_truth" or "generated"
    - name: EVAL_MODE
      value: "generated"

    # Test dataset path (ShareGPT format)
    - name: DATASET_PATH
      value: "/outputs/fire_preprocessed_v2/fire_sharegpt_test.jsonl"

    # Fine-tuned model checkpoint path
    # UPDATE THIS to your actual checkpoint path
    - name: MODEL_PATH
      value: "/outputs/qwen2_5vl-7b-fire-full-sft/checkpoint-final"

    # Reward model for scoring
    - name: REWARD_MODEL_ID
      value: "Skywork/Skywork-VL-Reward-7B"

    # Evaluation parameters
    - name: MAX_SAMPLES
      value: "10"  # Start small for testing, set to 0 for all
    - name: MAX_TURNS
      value: "3"   # Maximum refinement turns
    - name: PLATEAU_THRESHOLD
      value: "0.5"

    # Generation parameters (for generated mode)
    - name: TEMPERATURE
      value: "0.7"
    - name: TOP_P
      value: "0.9"
    - name: MAX_NEW_TOKENS
      value: "512"

    # ============================================
    # SYSTEM CONFIGURATION
    # ============================================

    # Python and CUDA settings
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: "expandable_segments:True"

  # tolerations:
  #   - key: nautilus.io/reservation
  #     operator: Exists
  #     effect: NoSchedule
  #   - effect: NoSchedule
  #     key: nautilus.io/hardware
  #     operator: Equal
  #     value: large-gpu
  #   - effect: PreferNoSchedule
  #     key: nvidia.com/gpu
  #     operator: Exists
  #   # Tolerate nautilus.io/issue taints (nodes with known issues but still usable)
  #   - key: nautilus.io/issue
  #     operator: Exists
  #     effect: NoSchedule

  # affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #       - matchExpressions:
  #         - key: nvidia.com/gpu.product
  #           operator: In
  #           values:
  #           - NVIDIA-RTX-A6000

  volumes:
    - name: cache-volume
      persistentVolumeClaim:
        claimName: ms-swift-cache-pvc
    - name: outputs-volume
      persistentVolumeClaim:
        claimName: ms-swift-outputs-pvc
    - name: dev-shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
