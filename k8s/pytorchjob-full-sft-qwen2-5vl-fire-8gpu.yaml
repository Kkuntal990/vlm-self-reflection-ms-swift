apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: qwen2-5vl-7b-fire-full-sft-8gpu
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        metadata:
          labels:
            app: ms-swift
            task: fire-full-sft-multinode
            model: qwen2-5-vl-7b
            gpu: a100
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          containers:
          - name: pytorch
            image: ghcr.io/kkuntal990/ms-swift-qwen:latest
            imagePullPolicy: Always
            command: ["/bin/bash"]
            args:
            - "-c"
            - |
              echo "========================================="
              echo "FIRE Multi-Node Full Fine-Tuning (Master)"
              echo "Full Parameter Update for Qwen2.5-VL-7B"
              echo "========================================="
              echo ""

              # Verify dataset exists
              if [ ! -f "${DATASET_PATH}" ]; then
                echo "ERROR: Training dataset not found!"
                echo "Expected: ${DATASET_PATH}"
                echo ""
                echo "Please ensure the dataset file exists."
                exit 1
              fi

              echo "Found dataset:"
              ls -lh "${DATASET_PATH}"
              wc -l "${DATASET_PATH}"
              echo ""

              # GPU verification
              echo "GPU Status:"
              nvidia-smi
              echo ""

              # Multi-node info
              echo "Multi-Node Configuration:"
              echo "  MASTER_ADDR: ${MASTER_ADDR}"
              echo "  MASTER_PORT: ${MASTER_PORT}"
              echo "  NNODES: ${NNODES}"
              echo "  NODE_RANK: ${NODE_RANK}"
              echo "  NPROC_PER_NODE: ${NPROC_PER_NODE}"
              echo ""

              # Start training
              echo "Starting multi-node full fine-tuning..."
              echo ""
              /workspace/scripts/training/run_full_sft_qwen3vl_fire_multinode.sh

            resources:
              requests:
                nvidia.com/a100: "2"
                memory: "96Gi"
                cpu: "8"
              limits:
                nvidia.com/a100: "2"
                memory: "96Gi"
                cpu: "8"

            volumeMounts:
            - name: cache-volume
              mountPath: /cache
            - name: outputs-volume
              mountPath: /outputs
            - name: dev-shm
              mountPath: /dev/shm

            env:
            # HuggingFace token (required for gated models)
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true

            # Cache directories (from scripts/training/env.sh)
            - name: HF_HOME
              value: "/cache/hf"
            - name: TRANSFORMERS_CACHE
              value: "/cache/hf/transformers"
            - name: HF_DATASETS_CACHE
              value: "/cache/hf/datasets"
            - name: TORCH_HOME
              value: "/cache/torch"
            - name: PIP_CACHE_DIR
              value: "/cache/pip"
            - name: OUTPUT_DIR
              value: "/outputs"

            # Model configuration
            - name: MODEL_ID
              value: "Qwen/Qwen2.5-VL-7B-Instruct"
            - name: DATASET_PATH
              value: "/outputs/fire_preprocessed_v2/fire_sharegpt_train.jsonl"

            # Sequence configuration
            - name: MAX_LEN
              value: "3248"
            - name: IMAGE_MAX_TOKEN_NUM
              value: "2048"

            # Multi-node configuration
            - name: NNODES
              value: "2"
            - name: NPROC_PER_NODE
              value: "2"
            - name: NODE_RANK
              value: "0"

            # Training hyperparameters
            - name: BATCH
              value: "4"
            - name: GRAD_ACC
              value: "8"
            # Effective batch size: 4 × 8 × 8 GPUs = 256
            - name: EPOCHS
              value: "1"
            - name: LR
              value: "5e-6"
            - name: WARMUP_RATIO
              value: "0.03"
            - name: WEIGHT_DECAY
              value: "0.01"
            - name: MAX_GRAD_NORM
              value: "1.0"
            - name: LOSS_SCALE
              value: "default"

            # Output configuration
            - name: RUN_NAME
              value: "qwen2_5vl-7b-fire-full-sft-multinode-single-turn"

            # Logging configuration
            - name: LOGGING_STEPS
              value: "5"
            - name: EVAL_STEPS
              value: "200"
            - name: SAVE_STEPS
              value: "200"
            - name: SAVE_TOTAL_LIMIT
              value: "2"

            # NCCL configuration for multi-node (optimized)
            - name: NCCL_DEBUG
              value: "WARN"
            - name: NCCL_TIMEOUT
              value: "1800"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_P2P_DISABLE
              value: "0"
            - name: NCCL_SOCKET_NTHREADS
              value: "2"
            - name: NCCL_NSOCKS_PERTHREAD
              value: "2"
            - name: NCCL_BUFFSIZE
              value: "8388608"
            - name: NCCL_ASYNC_ERROR_HANDLING
              value: "1"

            # Python and CUDA settings
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: TORCH_DISTRIBUTED_DEBUG
              value: "OFF"

          tolerations:
            - effect: NoSchedule
              key: nautilus.io/hardware
              operator: Equal
              value: large-gpu
            - effect: PreferNoSchedule
              key: nvidia.com/gpu
              operator: Exists
            - key: nautilus.io/reservation
              operator: Exists
              effect: NoSchedule

          volumes:
          - name: cache-volume
            emptyDir:
              sizeLimit: 200Gi
          - name: outputs-volume
            persistentVolumeClaim:
              claimName: ms-swift-outputs-pvc
          - name: dev-shm
            emptyDir:
              medium: Memory
              sizeLimit: 32Gi

    Worker:
      replicas: 1
      restartPolicy: OnFailure
      template:
        metadata:
          labels:
            app: ms-swift
            task: fire-full-sft-multinode
            model: qwen2-5-vl-7b
            gpu: a100
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          containers:
          - name: pytorch
            image: ghcr.io/kkuntal990/ms-swift-qwen:latest
            imagePullPolicy: Always
            command: ["/bin/bash"]
            args:
            - "-c"
            - |
              echo "========================================="
              echo "FIRE Multi-Node Full Fine-Tuning (Worker)"
              echo "Full Parameter Update for Qwen2.5-VL-7B"
              echo "========================================="
              echo ""

              # Verify dataset exists
              if [ ! -f "${DATASET_PATH}" ]; then
                echo "ERROR: Training dataset not found!"
                echo "Expected: ${DATASET_PATH}"
                echo ""
                echo "Please ensure the dataset file exists."
                exit 1
              fi

              echo "Found dataset:"
              ls -lh "${DATASET_PATH}"
              wc -l "${DATASET_PATH}"
              echo ""

              # GPU verification
              echo "GPU Status:"
              nvidia-smi
              echo ""

              # Multi-node info
              echo "Multi-Node Configuration:"
              echo "  MASTER_ADDR: ${MASTER_ADDR}"
              echo "  MASTER_PORT: ${MASTER_PORT}"
              echo "  NNODES: ${NNODES}"
              echo "  NODE_RANK: ${NODE_RANK}"
              echo "  NPROC_PER_NODE: ${NPROC_PER_NODE}"
              echo ""

              # Start training
              echo "Starting multi-node full fine-tuning..."
              echo ""
              /workspace/scripts/training/run_full_sft_qwen3vl_fire_multinode.sh

            resources:
              requests:
                nvidia.com/a100: "2"
                memory: "96Gi"
                cpu: "8"
              limits:
                nvidia.com/a100: "2"
                memory: "64Gi"
                cpu: "8"

            volumeMounts:
            - name: cache-volume
              mountPath: /cache
            - name: outputs-volume
              mountPath: /outputs
            - name: dev-shm
              mountPath: /dev/shm

            env:
            # HuggingFace token (required for gated models)
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true

            # Cache directories (from scripts/training/env.sh)
            - name: HF_HOME
              value: "/cache/hf"
            - name: TRANSFORMERS_CACHE
              value: "/cache/hf/transformers"
            - name: HF_DATASETS_CACHE
              value: "/cache/hf/datasets"
            - name: TORCH_HOME
              value: "/cache/torch"
            - name: PIP_CACHE_DIR
              value: "/cache/pip"
            - name: OUTPUT_DIR
              value: "/outputs"

            # Model configuration
            - name: MODEL_ID
              value: "Qwen/Qwen2.5-VL-7B-Instruct"
            - name: DATASET_PATH
              value: "/outputs/fire_preprocessed_v2/fire_sharegpt_train.jsonl"

            # Sequence configuration
            - name: MAX_LEN
              value: "3048"
            - name: IMAGE_MAX_TOKEN_NUM
              value: "2048"

            # Multi-node configuration
            - name: NNODES
              value: "2"
            - name: NPROC_PER_NODE
              value: "2"
            - name: NODE_RANK
              value: "1"

            # Training hyperparameters
            - name: BATCH
              value: "4"
            - name: GRAD_ACC
              value: "8"
            # Effective batch size: 4 × 8 × 8 GPUs = 256
            - name: EPOCHS
              value: "2"
            - name: LR
              value: "5e-6"
            - name: WARMUP_RATIO
              value: "0.03"
            - name: WEIGHT_DECAY
              value: "0.01"
            - name: MAX_GRAD_NORM
              value: "1.0"
            - name: LOSS_SCALE
              value: "default"

            # Output configuration
            - name: RUN_NAME
              value: "qwen2_5vl-7b-fire-full-sft-multinode-single-turn"

            # Logging configuration
            - name: LOGGING_STEPS
              value: "5"
            - name: EVAL_STEPS
              value: "200"
            - name: SAVE_STEPS
              value: "200"
            - name: SAVE_TOTAL_LIMIT
              value: "2"

            # NCCL configuration for multi-node (optimized)
            - name: NCCL_DEBUG
              value: "WARN"
            - name: NCCL_TIMEOUT
              value: "1800"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_P2P_DISABLE
              value: "0"
            - name: NCCL_SOCKET_NTHREADS
              value: "2"
            - name: NCCL_NSOCKS_PERTHREAD
              value: "2"
            - name: NCCL_BUFFSIZE
              value: "8388608"
            - name: NCCL_ASYNC_ERROR_HANDLING
              value: "1"

            # Python and CUDA settings
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: TORCH_DISTRIBUTED_DEBUG
              value: "OFF"

          tolerations:
            - effect: NoSchedule
              key: nautilus.io/hardware
              operator: Equal
              value: large-gpu
            - effect: PreferNoSchedule
              key: nvidia.com/gpu
              operator: Exists
            - key: nautilus.io/reservation
              operator: Exists
              effect: NoSchedule
            - key: nautilus.io/issue
              operator: Exists
              effect: NoSchedule

          volumes:
          - name: cache-volume
            emptyDir:
              sizeLimit: 200Gi
          - name: outputs-volume
            persistentVolumeClaim:
              claimName: ms-swift-outputs-pvc
          - name: dev-shm
            emptyDir:
              medium: Memory
              sizeLimit: 32Gi
