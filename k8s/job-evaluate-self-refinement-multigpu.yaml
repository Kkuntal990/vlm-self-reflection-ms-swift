apiVersion: batch/v1
kind: Job
metadata:
  name: eval-job-self-refinement-llava-st-mt-lvlm
  labels:
    app: ms-swift
    task: self-refinement-evaluation
    model: llava-7b
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ms-swift
        task: self-refinement-evaluation
    spec:
      restartPolicy: Never

      containers:
      - name: evaluator
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always

        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "========================================="
          echo "Self-Reflective Inference V2 (Multi-GPU)"
          echo "========================================="
          echo ""
          echo "Model Path:      ${MODEL_PATH}"
          echo "Base Model Path: ${BASE_MODEL_PATH:-none (full model)}"
          echo "Dataset: ${DATASET_PATH}"
          echo "Output: ${OUTPUT_PATH}"
          echo "Image Base Dir: ${IMAGE_BASE_DIR}"
          echo "Start Index: ${START_INDEX}"
          echo "Max Samples: ${MAX_SAMPLES} (0 = all)"
          echo "Num Turns: ${NUM_TURNS} (0 = use ground truth)"
          echo "Temperature: ${TEMPERATURE}"
          echo "Feedback Temperature: ${FEEDBACK_TEMPERATURE}"
          echo "Batch Size: ${BATCH_SIZE}"
          echo "Num GPUs: ${NUM_GPUS}"
          echo ""

          # Verify GPU availability
          echo "GPU Status:"
          nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv
          echo ""

          # Verify dataset exists
          if [ ! -f "${DATASET_PATH}" ]; then
            echo "ERROR: Test dataset not found: ${DATASET_PATH}"
            exit 1
          fi

          echo "Dataset found:"
          ls -lh "${DATASET_PATH}"
          echo "Sample count: $(wc -l < "${DATASET_PATH}")"
          echo ""

          # Verify model checkpoint exists
          if [ ! -d "${MODEL_PATH}" ] && [ ! -f "${MODEL_PATH}/config.json" ]; then
            echo "WARNING: Model checkpoint not found at ${MODEL_PATH}"
            echo "Checking if it's a HuggingFace model ID..."
          else
            echo "Model checkpoint found:"
            ls -lh "${MODEL_PATH}/" | head -5
            echo ""
          fi

          # Create output directory
          mkdir -p "$(dirname "${OUTPUT_PATH}")"

          # Run multi-GPU self-reflective inference
          echo "Starting multi-GPU inference (${NUM_GPUS} GPUs, batch_size=${BATCH_SIZE})..."
          echo ""

          INFER_CMD="accelerate launch \
            --num_processes ${NUM_GPUS} \
            --main_process_port 29501 \
            /workspace/scripts/evaluation/self_reflective_inference_v2.py \
            --model_path ${MODEL_PATH} \
            --dataset_path ${DATASET_PATH} \
            --output_path ${OUTPUT_PATH} \
            --image_base_dir ${IMAGE_BASE_DIR} \
            --temperature ${TEMPERATURE} \
            --feedback_temperature ${FEEDBACK_TEMPERATURE} \
            --start_index ${START_INDEX} \
            --max_samples ${MAX_SAMPLES} \
            --num_turns ${NUM_TURNS} \
            --batch_size ${BATCH_SIZE} \
            --multi_gpu"
          if [ -n "${BASE_MODEL_PATH:-}" ]; then
            INFER_CMD="${INFER_CMD} --base_model_path ${BASE_MODEL_PATH}"
          fi
          eval "${INFER_CMD}"

          echo ""
          echo "========================================="
          echo "Inference Complete"
          echo "========================================="
          echo ""
          echo "Results saved to: ${OUTPUT_PATH}"
          ls -lh "${OUTPUT_PATH}"
          echo ""

        env:
        # HuggingFace token
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # Cache directories
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: HF_DATASETS_CACHE
          value: "/cache/hf/datasets"
        - name: TORCH_HOME
          value: "/cache/torch"

        # Model and dataset paths
        - name: MODEL_PATH
          value: "/outputs/llava-7b-fire-full-sft-mt-st-lvlm/v7-20260226-215219/checkpoint-338"
        # value: "llava-hf/llava-1.5-7b-hf"
        - name: BASE_MODEL_PATH
          value: ""  # Set to base model path for LoRA adapter checkpoints
        - name: DATASET_PATH
          value: "/outputs/fire_preprocessed_v3/fire_messages_test.jsonl"
        - name: OUTPUT_PATH
          value: "/outputs/inference_v5/llava_st_mt_lvlm_t2.jsonl"
        - name: IMAGE_BASE_DIR
          value: "/outputs/image_base"

        # Sampling parameters
        - name: START_INDEX
          value: "0"
        - name: MAX_SAMPLES
          value: "0"
        - name: NUM_TURNS
          value: "2"

        # Generation parameters
        - name: TEMPERATURE
          value: "0.2"
        - name: FEEDBACK_TEMPERATURE
          value: "0"

        # Batch and parallelism (batch_size per GPU)
        - name: BATCH_SIZE
          value: "8"
        - name: NUM_GPUS
          value: "2"

        # Python and CUDA settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: NCCL_DEBUG
          value: "WARN"

        resources:
          requests:
            nvidia.com/rtxa6000: "2"
            memory: "32Gi"
            cpu: "4"
          limits:
            nvidia.com/rtxa6000: "2"
            memory: "40Gi"
            cpu: "4"

        volumeMounts:
        - name: outputs-volume
          mountPath: /outputs
        - name: dev-shm
          mountPath: /dev/shm

      tolerations:
        - effect: NoSchedule
          key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule
        - key: nautilus.io/issue
          operator: Exists
          effect: NoSchedule

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 100Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
