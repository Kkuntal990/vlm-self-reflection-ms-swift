apiVersion: batch/v1
kind: Job
metadata:
  name: fire-feedback-preprocess-cpu-job
  labels:
    app: ms-swift
    task: fire-feedback-preprocessing
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ms-swift
        task: fire-feedback-preprocessing
    spec:
      containers:
      - name: fire-feedback-preprocessor
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always

        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "========================================="
          echo "FIRE Feedback SFT Dataset Preprocessing"
          echo "Messages Format with Loss Control"
          echo "========================================="
          echo ""
          echo "Dataset: ${DATASET_ID}"
          echo "Mapping file: /outputs/fire_image_mapping_complete.json"
          echo "Splits: ${SPLITS}"
          echo "Max samples: ${MAX_SAMPLES} (0 = all)"
          echo ""
          echo "Output format: Messages with per-message loss field"
          echo "  - First assistant (question): loss=false"
          echo "  - Subsequent assistant (feedback): loss=true"
          echo ""

          # Verify mapping file exists
          if [ ! -f /outputs/fire_image_mapping_complete.json ]; then
            echo "ERROR: Complete mapping file not found!"
            echo "Expected: /outputs/fire_image_mapping_complete.json"
            echo "This should be created by merging HF and local mappings."
            exit 1
          fi

          echo "Mapping file found ($(du -h /outputs/fire_image_mapping_complete.json | cut -f1))"
          echo ""

          # Run preprocessing with complete mapping (HF + local images)
          # Uses lazy loading for memory efficiency

          echo "Processing TRAIN and TEST splits with complete mapping..."
          python /workspace/scripts/prepare_fire_feedback_sft.py \
            --dataset_id "${DATASET_ID}" \
            --output_dir /outputs/fire_feedback \
            --image_dir /outputs/fire_feedback_images \
            --mapping_file /outputs/fire_image_mapping_complete.json \
            --max_samples ${MAX_SAMPLES} \
            --splits train test

          echo ""
          echo "========================================="
          echo "Preprocessing Complete"
          echo "========================================="
          echo ""
          echo "Output files:"
          ls -lh /outputs/fire_feedback/
          echo ""
          echo "Sample counts:"
          wc -l /outputs/fire_feedback/fire_feedback_*.jsonl 2>/dev/null || echo "No JSONL files found"
          echo ""
          echo "Statistics:"
          cat /outputs/fire_feedback/stats.json
          echo ""
          if [ -f /outputs/fire_feedback/fire_feedback_train.jsonl ]; then
            echo "First training example (truncated):"
            head -1 /outputs/fire_feedback/fire_feedback_train.jsonl | python -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f'Messages count: {len(data[\"messages\"])}')
          for i, msg in enumerate(data['messages'][:4]):
              role = msg['role']
              content = msg['content'][:100] + '...' if len(msg['content']) > 100 else msg['content']
              loss = msg.get('loss', 'N/A')
              print(f'  [{i}] {role}: {content}')
              if role == 'assistant':
                  print(f'       loss: {loss}')
          print(f'  ... and {len(data[\"messages\"]) - 4} more messages')
          "
            echo ""
          fi
          echo "Ready for training! Submit job-feedback-sft-qwen3vl-8gpu.yaml"
          echo "========================================="

        env:
        # HuggingFace token (optional for public datasets)
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # Dataset configuration
        - name: DATASET_ID
          value: "PengxiangLi/FIRE"

        # Preprocessing configuration
        - name: SPLITS
          value: "train test"  # Both splits processed with lazy loading

        - name: MAX_SAMPLES
          value: "0"  # Testing with 100 samples first, then set to "0" for full run

        resources:
          requests:
            memory: "64Gi"
            cpu: "1"
          limits:
            memory: "64Gi"
            cpu: "1"

        volumeMounts:
        - name: cache-volume
          mountPath: /cache
        - name: outputs-volume
          mountPath: /outputs

      restartPolicy: Never

      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: ms-swift-cache-pvc
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
