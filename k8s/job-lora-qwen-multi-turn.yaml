apiVersion: batch/v1
kind: Job
metadata:
  name: qwen-7b-lora-multi-turn
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: ms-swift-lora
        task: fire-lora-sft
        model: qwen2-5-vl-7b
        gpu: a100
    spec:
      restartPolicy: Never

      containers:
      - name: ms-swift-trainer
        image: ghcr.io/kkuntal990/ms-swift-qwen:latest
        imagePullPolicy: Always
        command: ["/bin/bash"]
        args:
        - "-c"
        - |
          echo "========================================="
          echo "LoRA SFT for Qwen2.5-VL-7B (4 GPUs)"
          echo "========================================="
          echo ""

          # Verify datasets exist
          echo "Checking datasets..."
          for dataset in ${DATASET_PATH}; do
            dataset_file="${dataset%%#*}"
            if [ ! -f "${dataset_file}" ]; then
              echo "ERROR: Training dataset not found!"
              echo "Expected: ${dataset_file}"
              exit 1
            fi
            echo "Found: ${dataset}"
            ls -lh "${dataset_file}"
            wc -l "${dataset_file}"
            echo ""
          done

          # GPU verification
          echo "GPU Status:"
          nvidia-smi
          echo ""

          # Start LoRA training
          echo "Starting LoRA fine-tuning..."
          echo ""
          /workspace/scripts/training/run_lora_sft_qwen25vl.sh

        resources:
          requests:
            nvidia.com/a100: "4"
            memory: "128Gi"
            cpu: "8"
          limits:
            nvidia.com/a100: "4"
            memory: "128Gi"
            cpu: "8"

        volumeMounts:
        - name: cache-volume
          mountPath: /cache
        - name: outputs-volume
          mountPath: /outputs
        - name: dev-shm
          mountPath: /dev/shm

        env:
        # HuggingFace token
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true

        # Cache directories
        - name: HF_HOME
          value: "/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        - name: HF_DATASETS_CACHE
          value: "/cache/hf/datasets"
        - name: TORCH_HOME
          value: "/cache/torch"
        - name: PIP_CACHE_DIR
          value: "/cache/pip"
        - name: MODELSCOPE_CACHE
          value: "/cache/modelscope"
        - name: OUTPUT_DIR
          value: "/outputs"

        # Model configuration
        - name: MODEL_ID
          value: "Qwen/Qwen2.5-VL-7B-Instruct"
        - name: DATASET_PATH
          value: "/outputs/mixed_training_v1/fire_messages_filtered.jsonl /outputs/mixed_training_v1/fire_messages_single_turn.jsonl /outputs/fire_preprocessed_v3/fire_feedback_train_v2_with_thought.jsonl /outputs/mixed_training_v1/lvlm_nlf_multiturn.jsonl /outputs/mixed_training_v1/lvlm_nlf_single_turn.jsonl /outputs/mixed_training_v1/lvlm_nlf_feedback.jsonl /outputs/mixed_training_v1/vqa_aokvqa.jsonl /outputs/mixed_training_v1/vqa_scienceqa.jsonl /outputs/mixed_training_v1/vqa_tallyqa.jsonl"

        # Sequence configuration
        - name: MAX_LEN
          value: "3124"
        - name: IMAGE_MAX_TOKEN_NUM
          value: "2048"

        # LoRA configuration
        - name: LORA_RANK
          value: "16"
        - name: LORA_ALPHA
          value: "32"
        - name: LORA_DROPOUT
          value: "0.05"
        - name: TARGET_MODULES
          value: "all-linear"

        # Training hyperparameters
        - name: BATCH
          value: "8"           # Per-GPU batch size (LoRA uses less VRAM)
        - name: GRAD_ACC
          value: "8"           # Gradient accumulation steps
        - name: EPOCHS
          value: "1"           # Single epoch
        - name: LR
          value: "1e-4"        # LoRA learning rate
        - name: WARMUP_RATIO
          value: "0.05"        # 5% warmup
        - name: WEIGHT_DECAY
          value: "0.01"
        - name: MAX_GRAD_NORM
          value: "1.0"
        - name: LOSS_SCALE
          value: "default"
        - name: DEEPSPEED
          value: "zero2"
        - name: PACKING
          value: "false"

        # DDP configuration
        - name: NPROC
          value: "4"

        - name: NCCL_DEBUG
          value: "WARN"
        - name: NCCL_TIMEOUT
          value: "1800"

        # Output configuration
        - name: RUN_NAME
          value: "qwen-7b-lora-mixed-v1"
        - name: RESUME_PATH
          value: ""

        # Logging configuration
        - name: LOGGING_STEPS
          value: "10"
        - name: EVAL_STEPS
          value: "1000000"
        - name: SAVE_STEPS
          value: "500"
        - name: SAVE_TOTAL_LIMIT
          value: "3"

        # Python and CUDA settings
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"

      tolerations:
        - effect: NoSchedule
          key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
        - effect: PreferNoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: nautilus.io/reservation
          operator: Exists
          effect: NoSchedule
        - key: nautilus.io/issue
          operator: Exists
          effect: NoSchedule

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB

      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 200Gi
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: ms-swift-outputs-pvc
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
