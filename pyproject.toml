[project]
name = "vlm-self-reflection"
version = "0.1.0"
description = "VLM Fine-tuning Platform with Self-Refinement Evaluation"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    # DeepSpeed for distributed training
    "deepspeed>=0.14.0,<0.18",
    # Qwen-VL utilities (required for Qwen2.5-VL models)
    "qwen-vl-utils>=0.0.14",
    # Protobuf for model serialization
    "protobuf",
    # TRL - Transformers Reinforcement Learning (for value head in reward models)
    "trl>=0.8.0",
    # Safetensors for loading reward model weights
    "safetensors>=0.4.0",
    # Visualization for evaluation analysis
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]
jupyter = [
    "jupyter",
    "jupyterlab",
    "ipywidgets",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[tool.ruff]
# Main ruff configuration is in ruff.toml for better visibility

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
# Gradual typing - don't require all functions to be typed
disallow_untyped_defs = false
# Many ML libraries lack type stubs
ignore_missing_imports = true
exclude = [
    ".venv",
    "build",
    "data/notebooks",
]

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "trl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "datasets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qwen_vl_utils.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vllm.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
